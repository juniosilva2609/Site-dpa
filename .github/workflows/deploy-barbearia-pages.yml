name: Deploy Barbearia Marcelo Soares (GitHub Pages)

on:
  push:
    branches: ["claude/barbearia-marcelo-site-32xtl2"]
    paths: ["sites/barbearia-marcelo-soares/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload site folder as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sites/barbearia-marcelo-soares

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
