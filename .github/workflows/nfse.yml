name: nfse-testes
on:
  push:
    paths: ["nfse/**", ".github/workflows/nfse.yml"]
  pull_request:
    paths: ["nfse/**"]
jobs:
  testes:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nfse } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: nfse/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest -q
