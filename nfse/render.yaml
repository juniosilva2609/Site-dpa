# Exemplo de implantação no Render (plano com disco persistente).
services:
  - type: web
    name: nfse-automatica
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /saude
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NFSE_PROXY
        value: "1"
      - key: NFSE_DATA_DIR
        value: /var/data
      - key: NFSE_SAIDA_DIR
        value: /var/data/saida
      - key: SECRET_KEY
        generateValue: true
      # Informe no painel do Render (sync: false = não vai para o git):
      - key: NFSE_CERT_SENHA
        sync: false
      - key: NFSE_SETUP_CODE
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_SENHA
        sync: false
